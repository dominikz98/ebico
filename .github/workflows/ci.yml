name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the most recent run per branch/PR; older ones are cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # NuGet cache keyed on the project/CPM files. No packages.lock.json is used
      # deliberately (see docs/development/solution-layout.md), hence the explicit
      # actions/cache instead of the setup-dotnet cache option.
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore EBICO.sln

      - name: Build (Release, no new warnings)
        run: dotnet build EBICO.sln -c Release --no-restore

      - name: Test (+ Coverage)
        run: >-
          dotnet test EBICO.sln -c Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/coverage.cobertura.xml'
          if-no-files-found: error

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'
          if-no-files-found: warn

  docs-link-check:
    name: Docs Link Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Offline: checks relative doc links (Docs-as-Code) without flaky
      # external requests (e.g. the many ebics.org URLs). External links
      # can be added later as a non-blocking scheduled job.
      - name: Link checker (offline, relative links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --verbose "**/*.md"
          fail: true

  container-build:
    name: Container Build (Server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Builds the server container image (issue #61). Build-only: no registry login/push (that
      # belongs to the publish pipeline, M9 / #62). Keeps the Dockerfile green without needing secrets.
      - name: Build server image (build-only)
        run: docker build --build-arg PROJECT=EBICO.Server -t ebico-server:ci .

  pack:
    name: Pack (NuGet, build-only)
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Packs the published libraries EBICO.Core + EBICO.Connector (issue #50) incl.
      # README, XML doc, snupkg symbols, SourceLink and licence metadata. The CalVer BUILD component
      # comes from the run number ({YEAR}.{MONTH}.{run_number}). Build-only: no registry push — the
      # publishing belongs to the publish pipeline (M9 / #62). As with the container-build job, this keeps
      # the packages green without needing secrets.
      - name: Pack EBICO.Core (Release)
        run: >-
          dotnet pack src/EBICO.Core/EBICO.Core.csproj
          -c Release -o ./artifacts
          -p:EbicoBuildNumber=${{ github.run_number }}

      - name: Pack EBICO.Connector (Release)
        run: >-
          dotnet pack src/EBICO.Connector/EBICO.Connector.csproj
          -c Release -o ./artifacts
          -p:EbicoBuildNumber=${{ github.run_number }}

      - name: Upload NuGet artefact (nupkg + snupkg)
        uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: ./artifacts/*
          if-no-files-found: error
