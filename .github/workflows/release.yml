name: Release

# Tag-triggered publishing (M9 / #62, ADR-0027). The tag carries the CalVer version
# (v{YEAR}.{MONTH}.{BUILD}, e.g. v2026.7.42); the package and image versions are derived
# from it. Fires ONLY on v*.*.* tags — regular main pushes/PRs still go through ci.yml.
# Without the NUGET_API_KEY secret (nuget.org) the NuGet push does nothing; the GHCR push
# uses the automatic GITHUB_TOKEN. Merging this workflow therefore publishes nothing.
on:
  push:
    tags: ['v*.*.*']

# Least privilege: create the GitHub release (contents) + push the GHCR image (packages).
# The NuGet push needs no GITHUB permission, only the NUGET_API_KEY secret.
permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish (NuGet + Container)
    runs-on: ubuntu-latest
    env:
      NUGET_FEED: https://api.nuget.org/v3/index.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for auto-generated release notes & SourceLink

      - name: Setup .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Version from the tag: v2026.7.42 -> 2026.7.42. Must match the CalVer pattern
      # {YEAR}.{MONTH}.{BUILD} (ADR-0024/0027), otherwise abort.
      - name: Derive version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not yield a valid CalVer version ('$version'); expected vYEAR.MONTH.BUILD (e.g. v2026.7.42)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Release version: $version"

      - name: Restore
        run: dotnet restore EBICO.sln

      # Version-from-tag overrides the date-based CalVer computation in
      # Directory.Build.props (where BUILD otherwise comes from github.run_number). Build/test
      # re-verify the DoD (no new warnings, thanks to TreatWarningsAsErrors).
      - name: Build (Release, no new warnings)
        run: dotnet build EBICO.sln -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Test (Release)
        run: dotnet test EBICO.sln -c Release --no-build

      # Packs EBICO.Core + EBICO.Connector from the already-built output (--no-build);
      # -p:Version keeps the nuspec and assembly versions identical to the build above.
      - name: Pack EBICO.Core (Release)
        run: >-
          dotnet pack src/EBICO.Core/EBICO.Core.csproj
          -c Release --no-build -o ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      - name: Pack EBICO.Connector (Release)
        run: >-
          dotnet pack src/EBICO.Connector/EBICO.Connector.csproj
          -c Release --no-build -o ./artifacts
          -p:Version=${{ steps.version.outputs.version }}

      # Push to nuget.org. The .snupkg symbol packages are published automatically by
      # 'dotnet nuget push'. --skip-duplicate makes re-runs idempotent.
      - name: Push NuGet packages (nuget.org)
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "$NUGET_FEED"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --skip-duplicate

      # Container push to GHCR (ADR-0022 defers the push to this pipeline). Builds the
      # server image like the container-build job in ci.yml and pushes :VERSION + :latest.
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build & push server image (GHCR)
        run: |
          image="ghcr.io/${{ github.repository_owner }}/ebico-server"
          version="${{ steps.version.outputs.version }}"
          docker build --build-arg PROJECT=EBICO.Server -t "$image:$version" -t "$image:latest" .
          docker push "$image:$version"
          docker push "$image:latest"

      # GitHub release with automatically generated notes (from the PRs/commits since the
      # last tag) and the NuGet artefacts attached.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          ./artifacts/*.nupkg ./artifacts/*.snupkg
